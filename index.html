<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dansk Ord Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 1200px;
            width: 100%;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 40px;
            font-size: 3em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        button {
            padding: 15px 30px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        #generateBtn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        #generateBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        #generateBtn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .theme-selector {
            background: white;
            padding: 10px 20px;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .theme-selector select {
            border: none;
            background: transparent;
            font-size: 16px;
            font-weight: 600;
            color: #667eea;
            cursor: pointer;
            outline: none;
        }

        #words {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 20px;
        }

        .word-container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: fadeIn 0.5s ease;
        }

        .word-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .word-title {
            color: #667eea;
            font-size: 2em;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .word-type {
            display: inline-block;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85em;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .word-description {
            color: #555;
            font-size: 1.1em;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .word-sentence {
            color: #888;
            font-style: italic;
            font-size: 1em;
            line-height: 1.5;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2em;
            margin-top: 20px;
        }

        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #ff6b6b;
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin: 20px auto;
            max-width: 600px;
            text-align: center;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }
            
            #words {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎲 Dansk Ord Generator</h1>
        
        <div class="controls">
            <div class="theme-selector">
                <select id="themeSelect">
                    <option value="mixed">🎭 Blandet (alle temaer)</option>
                    <option value="mammals">🦁 Pattedyr</option>
                    <option value="names">👤 Danske Fornavne (6+ bogstaver)</option>
                    <option value="astronomy">🌌 Astronomi</option>
                    <option value="food">🍕 Mad</option>
                    <option value="cities">🏛️ EU Byer</option>
                    <option value="design">🎨 Design Stilarter</option>
                    <option value="romance">💕 Dating & Romantik</option>
                    <option value="romantasy">🗡️ Romantasy</option>
                    <option value="intimate">🌹 Erotik & Undertøj</option>
                </select>
            </div>
            <button id="generateBtn" onclick="generateWords()">Generer Nye Ord</button>
        </div>

        <div id="words"></div>
        <div id="loadingIndicator" style="display: none;">
            <div class="spinner"></div>
            <div class="loading">Genererer ord...</div>
        </div>
        <div id="errorIndicator" style="display: none;"></div>
    </div>

    <script>
        const themes = {
            mammals: {
                name: "Pattedyr",
                examples: ["leopard", "delfin", "gepard", "pandabjørn", "elefant", "næsehorn", "gorilla", "orangutang", "bjørn", "ulv"]
            },
            names: {
                name: "Danske Fornavne",
                examples: ["Alexander", "Isabella", "Sebastian", "Caroline", "Christopher", "Victoria", "Benjamin", "Josephine", "Frederik", "Mathilde"]
            },
            astronomy: {
                name: "Astronomi", 
                examples: ["supernova", "galakse", "exoplanet", "sortehul", "kometkerne", "stjernetåge", "måneformørkelse", "Andromedagalaksen", "pulsarstjerne", "kvasarer"]
            },
            food: {
                name: "Mad",
                examples: ["tapas", "risotto", "crème brûlée", "sushi", "bouillabaisse", "tiramisu", "paella", "foie gras", "wienerbrød", "smørrebrød"]
            },
            cities: {
                name: "EU Byer",
                examples: ["Barcelona", "Amsterdam", "Firenze", "Lissabon", "Wien", "Brugge", "København", "Dubrovnik", "Santorini", "Ljubljana"]
            },
            design: {
                name: "Design Stilarter",
                examples: ["minimalisme", "art deco", "bauhaus", "skandinavisk design", "brutalistisk", "boheme", "industriel", "midcentury modern", "maximalisme", "shabby chic"]
            },
            romance: {
                name: "Dating & Romantik",
                examples: ["tiltrækningskraft", "kemi", "forelsket", "forelskelse", "førstedate", "kompliment", "flirt", "kærtegn", "følelser", "sommerfugle i maven"]
            },
            romantasy: {
                name: "Romantasy",
                examples: ["fated mates", "shadowsinger", "blodbinding", "magisk forbindelse", "natdomstol", "krigerprinsesse", "soulbound", "skæbneforbundet", "ildemagi", "forbudt kærlighed"]
            },
            intimate: {
                name: "Erotik & Undertøj",
                examples: ["spitzenstring", "corsage", "strømpeholder", "silkemorgenkappe", "sensuelt", "fristelse", "lingerie", "body", "brasæt", "blonde"]
            }
        };

        async function generateWords() {
            const theme = document.getElementById('themeSelect').value;
            const wordsContainer = document.getElementById('words');
            const loadingIndicator = document.getElementById('loadingIndicator');
            const errorIndicator = document.getElementById('errorIndicator');
            const generateBtn = document.getElementById('generateBtn');

            // Show loading state
            generateBtn.disabled = true;
            loadingIndicator.style.display = 'block';
            errorIndicator.style.display = 'none';
            wordsContainer.innerHTML = '';

            try {
                const response = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        model: 'claude-sonnet-4-20250514',
                        max_tokens: 1000,
                        messages: [{
                            role: 'user',
                            content: `Generer 3 tilfældige ${theme === 'names' ? 'moderne danske fornavne (MINDST 7 bogstaver)' : theme === 'mammals' ? 'pattedyr (kun pattedyr - ingen fugle, fisk eller reptiler)' : theme === 'mixed' ? 'ord fra forskellige temaer (pattedyr, moderne danske fornavne 7+ bogstaver, astronomi, mad, EU byer, design stilarter, dating/romantik, romantasy, erotik/undertøj)' : 'danske ord fra ' + themes[theme].name + ' temaet'}.

${theme === 'names' ? 'For hvert navn skal du give:\n1. Navnet (moderne dansk fornavn med MINDST 7 bogstaver)\n2. Type: "Fornavn"\n3. Navnets betydning og oprindelse (1-2 sætninger)\n4. En sætning om en person med dette navn (eksempel: "Caroline er kendt for sin kreativitet")' : 'For hvert ord skal du give:\n1. Ordet selv (på dansk)\n2. Ordklasse (substantiv, verbum, adjektiv osv.)\n3. En kort, præcis definition (1-2 sætninger)\n4. En naturlig eksempelsætning der bruger ordet'}

Returner KUN et JSON array i dette format (ingen markdown, ingen forklaring):
[
  {
    "word": "${theme === 'names' ? 'navnet' : 'ordet'}",
    "type": "${theme === 'names' ? 'Fornavn' : 'ordklasse'}",
    "definition": "${theme === 'names' ? 'betydning og oprindelse' : 'definition her'}",
    "example": "eksempelsætning her"
  }
]

${theme === 'names' ? 'VIGTIGT: Alle navne skal være MINDST 7 bogstaver lange. Eksempler: Alexander, Isabella, Sebastian, Caroline, Christopher, Victoria, Benjamin, Josephine, Frederikke, Mathilde, Amalie, Mikkel, Andreas, Malthe, Villads, Magnus.' : theme === 'mammals' ? 'VIGTIGT: Kun pattedyr (f.eks. leopard, delfin, elefant, gepard, panda, gorilla, orangutang, bjørn, ulv, rev). Ingen fugle, fisk eller reptiler.' : ''}

Vær kreativ og varieret. ${theme === 'intimate' ? 'For erotik/undertøj temaet: vær sofistikeret og elegant, ikke vulgær.' : ''}`
                        }]
                    })
                });

                if (!response.ok) {
                    throw new Error('API request failed');
                }

                const data = await response.json();
                const content = data.content[0].text;
                
                // Clean up the response - remove markdown code blocks if present
                const cleanContent = content.replace(/```json\n?|\n?```/g, '').trim();
                const words = JSON.parse(cleanContent);

                // Display the words
                wordsContainer.innerHTML = '';
                words.forEach((word, index) => {
                    const wordDiv = document.createElement('div');
                    wordDiv.className = 'word-container';
                    wordDiv.style.animationDelay = `${index * 0.1}s`;
                    wordDiv.innerHTML = `
                        <h2 class="word-title">${word.word}</h2>
                        <span class="word-type">${word.type}</span>
                        <p class="word-description">${word.definition}</p>
                        <p class="word-sentence">"${word.example}"</p>
                    `;
                    wordsContainer.appendChild(wordDiv);
                });

            } catch (error) {
                console.error('Error:', error);
                errorIndicator.innerHTML = `
                    <div class="error">
                        Der opstod en fejl ved generering af ord. Prøv igen! 🔄
                    </div>
                `;
                errorIndicator.style.display = 'block';
            } finally {
                loadingIndicator.style.display = 'none';
                generateBtn.disabled = false;
            }
        }

        // Generate initial words on page load
        window.addEventListener('load', generateWords);
    </script>
</body>
</html>
