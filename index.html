<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dansk Ord Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: white;
            min-height: 100vh;
            padding: 0;
            margin: 0;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                linear-gradient(90deg, black 0px, black 8px, transparent 8px) 0 0,
                linear-gradient(0deg, black 0px, black 8px, transparent 8px) 0 0,
                linear-gradient(90deg, transparent 0, transparent calc(33.33% - 4px), black calc(33.33% - 4px), black calc(33.33% + 4px), transparent calc(33.33% + 4px)),
                linear-gradient(90deg, transparent 0, transparent calc(66.66% - 4px), black calc(66.66% - 4px), black calc(66.66% + 4px), transparent calc(66.66% + 4px)),
                linear-gradient(0deg, transparent 0, transparent calc(25% - 4px), black calc(25% - 4px), black calc(25% + 4px), transparent calc(25% + 4px)),
                linear-gradient(0deg, transparent 0, transparent calc(60% - 4px), black calc(60% - 4px), black calc(60% + 4px), transparent calc(60% + 4px));
            background-size: 100% 100%;
            z-index: -2;
            opacity: 0.15;
        }
        
        body::after {
            content: '';
            position: fixed;
            width: 200px;
            height: 200px;
            background: #FFD700;
            top: 10%;
            right: 15%;
            z-index: -1;
            border: 8px solid black;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            padding: 40px 20px;
            margin: 0 auto;
        }

        h1 {
            color: black;
            text-align: center;
            margin-bottom: 50px;
            font-size: 3em;
            font-weight: 900;
            letter-spacing: -1px;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            text-transform: uppercase;
            position: relative;
            padding: 30px;
            background: white;
            border: 8px solid black;
            box-shadow: 0 0 0 4px white, 0 0 0 12px black;
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        button {
            padding: 15px 35px;
            font-size: 16px;
            font-weight: 700;
            border: 4px solid black;
            border-radius: 0;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #generateBtn {
            background: #DE0D0D;
            color: white;
        }

        #generateBtn:hover {
            background: #b00a0a;
            transform: translate(-2px, -2px);
            box-shadow: 4px 4px 0 black;
        }

        #generateBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .theme-selector {
            background: #0055BF;
            padding: 10px 20px;
            border: 4px solid black;
            border-radius: 0;
        }

        .theme-selector select {
            border: none;
            background: transparent;
            font-size: 16px;
            font-weight: 700;
            color: white;
            cursor: pointer;
            outline: none;
            text-transform: uppercase;
        }
        
        .theme-selector select option {
            background: #0055BF;
            color: white;
        }

        #words {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 20px;
        }

        .word-container {
            background: white;
            border: 6px solid black;
            border-radius: 0;
            padding: 30px;
            transition: transform 0.2s ease;
            animation: fadeIn 0.4s ease;
            position: relative;
        }
        
        .word-container:nth-child(3n+1) {
            border-left: 12px solid #DE0D0D;
        }
        
        .word-container:nth-child(3n+2) {
            border-left: 12px solid #0055BF;
        }
        
        .word-container:nth-child(3n+3) {
            border-left: 12px solid #FFD700;
        }

        .word-container:hover {
            transform: translate(-3px, -3px);
            box-shadow: 6px 6px 0 black;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .word-title {
            color: black;
            font-size: 2.2em;
            margin-bottom: 15px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -1px;
        }

        .word-type {
            display: inline-block;
            background: black;
            color: white;
            padding: 8px 18px;
            border-radius: 0;
            font-size: 0.75em;
            margin-bottom: 15px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .word-description {
            color: #555;
            font-size: 1.1em;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .word-sentence {
            color: #333;
            font-style: italic;
            font-size: 1em;
            line-height: 1.6;
            padding: 15px 15px 15px 20px;
            background: #f5f5f5;
            border-radius: 0;
            border-left: 6px solid black;
            margin-top: 15px;
        }

        .loading {
            text-align: center;
            color: black;
            font-size: 1.2em;
            margin-top: 20px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .spinner {
            border: 6px solid #f5f5f5;
            border-top: 6px solid #DE0D0D;
            border-right: 6px solid #0055BF;
            border-bottom: 6px solid #FFD700;
            border-radius: 0;
            width: 60px;
            height: 60px;
            animation: spin 1.5s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #DE0D0D;
            color: white;
            padding: 20px;
            border: 4px solid black;
            border-radius: 0;
            margin: 20px auto;
            max-width: 600px;
            text-align: center;
            font-weight: 700;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }
            
            #words {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Nikolajs Ord Generator</h1>
        
        <div class="controls">
            <div class="theme-selector">
                <select id="themeSelect" onchange="onThemeChange()">
                    <option value="mixed">🎭 Blandet (alle temaer)</option>
                    <option value="mammals">🦁 Pattedyr</option>
                    <option value="names">👤 Danske Fornavne (6+ bogstaver)</option>
                    <option value="astronomy">🌌 Astronomi</option>
                    <option value="food">🍕 Mad</option>
                    <option value="cities">🏛️ EU Byer</option>
                    <option value="design">🎨 Design Stilarter</option>
                    <option value="romance">💕 Dating & Romantik</option>
                    <option value="romantasy">🗡️ Romantasy</option>
                    <option value="intimate">🌹 Erotik & Undertøj</option>
                </select>
            </div>
            <button id="generateBtn" onclick="showNextWords()">Generer Nye Ord</button>
        </div>

        <div id="words"></div>
        <div id="loadingIndicator" style="display: none;">
            <div class="spinner"></div>
            <div class="loading">Genererer ord...</div>
        </div>
        <div id="errorIndicator" style="display: none;"></div>
    </div>

    <script>
        const themes = {
            mammals: {
                name: "Pattedyr",
                examples: ["leopard", "delfin", "gepard", "pandabjørn", "elefant", "næsehorn", "gorilla", "orangutang", "bjørn", "ulv"]
            },
            names: {
                name: "Danske Fornavne",
                examples: ["Alexander", "Isabella", "Sebastian", "Caroline", "Christopher", "Victoria", "Benjamin", "Josephine", "Frederik", "Mathilde"]
            },
            astronomy: {
                name: "Astronomi", 
                examples: ["supernova", "galakse", "exoplanet", "sortehul", "kometkerne", "stjernetåge", "måneformørkelse", "Andromedagalaksen", "pulsarstjerne", "kvasarer"]
            },
            food: {
                name: "Mad",
                examples: ["tapas", "risotto", "crème brûlée", "sushi", "bouillabaisse", "tiramisu", "paella", "foie gras", "wienerbrød", "smørrebrød"]
            },
            cities: {
                name: "EU Byer",
                examples: ["Barcelona", "Amsterdam", "Firenze", "Lissabon", "Wien", "Brugge", "København", "Dubrovnik", "Santorini", "Ljubljana"]
            },
            design: {
                name: "Design Stilarter",
                examples: ["minimalisme", "art deco", "bauhaus", "skandinavisk design", "brutalistisk", "boheme", "industriel", "midcentury modern", "maximalisme", "shabby chic"]
            },
            romance: {
                name: "Dating & Romantik",
                examples: ["tiltrækningskraft", "kemi", "forelsket", "forelskelse", "førstedate", "kompliment", "flirt", "kærtegn", "følelser", "sommerfugle i maven"]
            },
            romantasy: {
                name: "Romantasy",
                examples: ["fated mates", "shadowsinger", "blodbinding", "magisk forbindelse", "natdomstol", "krigerprinsesse", "soulbound", "skæbneforbundet", "ildemagi", "forbudt kærlighed"]
            },
            intimate: {
                name: "Erotik & Undertøj",
                examples: ["spitzenstring", "corsage", "strømpeholder", "silkemorgenkappe", "sensuelt", "fristelse", "lingerie", "body", "brasæt", "blonde"]
            }
        };

        // Word pool storage
        let wordPool = {};
        let currentIndex = {};
        const PATTERN = [0, 2, 6, 12, 18, 20, 27]; // Pattern: 1-3-7-13-19-21-28 (0-indexed)

        async function preloadWords(theme) {
            try {
                const response = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        model: 'claude-sonnet-4-20250514',
                        max_tokens: 15000,
                        messages: [{
                            role: 'user',
                            content: `Generer 30 tilfældige ${theme === 'names' ? 'moderne danske fornavne (MINDST 7 bogstaver)' : theme === 'mammals' ? 'pattedyr (kun pattedyr - ingen fugle, fisk eller reptiler)' : theme === 'mixed' ? 'ord fra forskellige temaer (pattedyr, moderne danske fornavne 7+ bogstaver, astronomi, mad, EU byer, design stilarter, dating/romantik, romantasy, erotik/undertøj)' : 'danske ord fra ' + themes[theme].name + ' temaet'}.

${theme === 'names' ? 'For hvert navn skal du give:\n1. Navnet (moderne dansk fornavn med MINDST 7 bogstaver)\n2. Type: "Fornavn"\n3. Navnets betydning og oprindelse (1-2 sætninger)\n4. En sætning om en person med dette navn (eksempel: "Caroline er kendt for sin kreativitet")' : 'For hvert ord skal du give:\n1. Ordet selv (på dansk)\n2. Ordklasse (substantiv, verbum, adjektiv osv.)\n3. En kort, præcis definition (1-2 sætninger)\n4. En naturlig eksempelsætning der bruger ordet'}

Returner KUN et JSON array i dette format (ingen markdown, ingen forklaring):
[
  {
    "word": "${theme === 'names' ? 'navnet' : 'ordet'}",
    "type": "${theme === 'names' ? 'Fornavn' : 'ordklasse'}",
    "definition": "${theme === 'names' ? 'betydning og oprindelse' : 'definition her'}",
    "example": "eksempelsætning her"
  }
]

${theme === 'names' ? 'VIGTIGT: Alle navne skal være MINDST 7 bogstaver lange. Eksempler: Alexander, Isabella, Sebastian, Caroline, Christopher, Victoria, Benjamin, Josephine, Frederikke, Mathilde, Amalie, Mikkel, Andreas, Malthe, Villads, Magnus.' : theme === 'mammals' ? 'VIGTIGT: Kun pattedyr (f.eks. leopard, delfin, elefant, gepard, panda, gorilla, orangutang, bjørn, ulv, rev). Ingen fugle, fisk eller reptiler.' : ''}

Vær kreativ og varieret. ${theme === 'intimate' ? 'For erotik/undertøj temaet: vær sofistikeret og elegant, ikke vulgær.' : ''}`
                        }]
                    })
                });

                if (!response.ok) {
                    throw new Error('API request failed');
                }

                const data = await response.json();
                const content = data.content[0].text;
                const cleanContent = content.replace(/```json\n?|\n?```/g, '').trim();
                const words = JSON.parse(cleanContent);
                
                wordPool[theme] = words;
                currentIndex[theme] = 0;
                
            } catch (error) {
                console.error('Preload error:', error);
                throw error;
            }
        }

        function onThemeChange() {
            const theme = document.getElementById('themeSelect').value;
            showNextWords();
        }

        async function showNextWords() {
            const theme = document.getElementById('themeSelect').value;
            const wordsContainer = document.getElementById('words');
            const loadingIndicator = document.getElementById('loadingIndicator');
            const errorIndicator = document.getElementById('errorIndicator');
            const generateBtn = document.getElementById('generateBtn');

            try {
                // Preload if not loaded
                if (!wordPool[theme]) {
                    generateBtn.disabled = true;
                    loadingIndicator.style.display = 'block';
                    errorIndicator.style.display = 'none';
                    wordsContainer.innerHTML = '';
                    
                    await preloadWords(theme);
                    
                    loadingIndicator.style.display = 'none';
                    generateBtn.disabled = false;
                }

                // Get words using the pattern - INSTANT!
                const words = [];
                const pool = wordPool[theme];
                const startIdx = currentIndex[theme];
                
                for (let i = 0; i < 5; i++) {
                    const patternOffset = PATTERN[i % PATTERN.length];
                    const wordIdx = (startIdx + patternOffset) % pool.length;
                    words.push(pool[wordIdx]);
                }
                
                // Move to next pattern position
                currentIndex[theme] = (startIdx + 7) % pool.length;
                
                // If we've cycled through, reload fresh words in background
                if (currentIndex[theme] < 7) {
                    setTimeout(() => preloadWords(theme), 100);
                }

                // Display the words - INSTANT!
                wordsContainer.innerHTML = '';
                words.forEach((word, index) => {
                    const wordDiv = document.createElement('div');
                    wordDiv.className = 'word-container';
                    wordDiv.style.animationDelay = `${index * 0.1}s`;
                    wordDiv.innerHTML = `
                        <h2 class="word-title">${word.word}</h2>
                        <span class="word-type">${word.type}</span>
                        <p class="word-description">${word.definition}</p>
                        <p class="word-sentence">"${word.example}"</p>
                    `;
                    wordsContainer.appendChild(wordDiv);
                });

            } catch (error) {
                console.error('Error:', error);
                errorIndicator.innerHTML = `
                    <div class="error">
                        Der opstod en fejl ved generering af ord. Prøv igen! 🔄
                    </div>
                `;
                errorIndicator.style.display = 'block';
                loadingIndicator.style.display = 'none';
                generateBtn.disabled = false;
            }
        }

        // Generate initial words on page load
        window.addEventListener('load', showNextWords);
    </script>
</body>
</html>
