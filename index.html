<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nikolajs Ord Generator</title>

<style>
body { font-family: Arial, sans-serif; background:#fff; margin:0; padding:40px }
h1 { text-align:center; margin-bottom:30px }
.controls { text-align:center; margin-bottom:20px }
button { padding:10px 20px; font-size:16px; cursor:pointer }
#words {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:20px;
}
.word {
  border:4px solid #000;
  padding:20px;
}
.type {
  display:inline-block;
  background:#000;
  color:#fff;
  padding:4px 10px;
  margin:8px 0;
  font-size:12px;
}
</style>
</head>

<body>

<h1>Nikolajs Ord Generator</h1>

<div class="controls">
  <button onclick="generate()">Generer nye ord</button>
</div>

<div id="words"></div>

<script>
let ORDSAMLING = [];

async function loadWords() {
  try {
    const response = await fetch('ordsamling.json');
    ORDSAMLING = await response.json();
    generate();
  } catch (error) {
    console.error('Kunne ikke indlæse ord:', error);
    document.getElementById('words').innerHTML = 
      '<p style="text-align:center;color:red;">Fejl: Kunne ikke indlæse ordsamling.json</p>';
  }
}

function generate() {
  const container = document.getElementById("words");
  container.innerHTML = "";

  if (ORDSAMLING.length === 0) {
    container.innerHTML = '<p style="text-align:center;">Indlæser ord...</p>';
    return;
  }

  const shuffled = [...ORDSAMLING]
    .sort(() => 0.5 - Math.random())
    .slice(0, 5);

  shuffled.forEach(w => {
    const div = document.createElement("div");
    div.className = "word";
    div.innerHTML = `
      <h2>${w.ord}</h2>
      <div class="type">Begreb</div>
      <p>${w.forklaring}</p>
    `;
    container.appendChild(div);
  });
}

window.onload = loadWords;
</script>

</body>
</html>
